databases:
  - name: ewaste-db
    plan: free

services:
  - type: web
    name: ewaste-backend
    runtime: docker
    rootDir: backend
    plan: free
    envVars:
      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        fromDatabase:
          name: ewaste-db
          property: connectionString

      - key: GOOGLE_API_KEY
        sync: false

      - key: FRONTEND_URL
        fromService:
          type: web
          name: ewaste-frontend
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    runtime: static
    name: ewaste-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ewaste-backend
          envVarKey: RENDER_EXTERNAL_URL